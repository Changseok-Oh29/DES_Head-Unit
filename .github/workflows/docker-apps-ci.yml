name: Docker Apps CI (Local x86_64)

on:
  push:
    branches: [PDC]
    paths:
      - 'app/**'
      - 'deps/**'
      - 'commonapi/**'
      - '.github/workflows/docker-apps-ci.yml'
  pull_request:
    branches: [PDC]
    paths:
      - 'app/**'
      - 'deps/**'
      - 'commonapi/**'
  workflow_dispatch:  # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: humainapp
            dockerfile: app/HU_MainApp/Dockerfile
          - name: gearapp
            dockerfile: app/GearApp/Dockerfile
          - name: pdcapp
            dockerfile: app/PDCApp/Dockerfile
          - name: homescreenapp
            dockerfile: app/HomeScreenApp/Dockerfile
          - name: mediaapp
            dockerfile: app/MediaApp/Dockerfile
          - name: ambientapp
            dockerfile: app/AmbientApp/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.app.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.app.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## Docker Apps Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| HU_MainApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GearApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PDCApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HomeScreenApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MediaApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AmbientApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
