name: Docker Apps CI (Local x86_64)

on:
  push:
    branches: [PDC]
    paths:
      - 'app/**'
      - 'deps/**'
      - 'commonapi/**'
      - '.github/workflows/docker-apps-ci.yml'
  pull_request:
    branches: [PDC]
    paths:
      - 'app/**'
      - 'deps/**'
      - 'commonapi/**'
  workflow_dispatch:  # Manual trigger

env:
  REGISTRY: ghcr.io
  # This will be: ghcr.io/OWNER/des_head-unit
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/des_head-unit

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to push to GHCR

    strategy:
      fail-fast: false
      matrix:
        app:
          - name: humainapp
            dockerfile: app/HU_MainApp/Dockerfile
          - name: gearapp
            dockerfile: app/GearApp/Dockerfile
          - name: pdcapp
            dockerfile: app/PDCApp/Dockerfile
          - name: homescreenapp
            dockerfile: app/HomeScreenApp/Dockerfile
          - name: mediaapp
            dockerfile: app/MediaApp/Dockerfile
          - name: ambientapp
            dockerfile: app/AmbientApp/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app.name }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and push ${{ matrix.app.name }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.app.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  summary:
    needs: build
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Build Summary
        run: |
          echo "## Docker Apps Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| App | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| HU_MainApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GearApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| PDCApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| HomeScreenApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| MediaApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AmbientApp | ${{ needs.build.result == 'success' && '✅ Pass' || '❌ Fail' }} |" >> $GITHUB_STEP_SUMMARY
