name: Yocto Build CI/CD

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'meta/**'
      - 'yocto-build/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:  # Allows manual triggering

jobs:
  build-yocto:
    runs-on: self-hosted  # Uses your self-hosted runner
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Set up build environment
        run: |
          echo "Building on self-hosted runner: $(hostname)"
          df -h
          free -h
      
      - name: Build Yocto image in Docker
        run: |
          docker run --rm \
            -v $(pwd):/workspace \
            -v /home/seame/PDC/headunit/yocto-build:/build \
            -w /workspace \
            yocto-builder:latest \
            bash -c "
              cd /build
              source poky/oe-init-build-env
              bitbake core-image-minimal
            "
      
      - name: Check build artifacts
        run: |
          ls -lh /home/seame/PDC/headunit/yocto-build/build/tmp/deploy/images/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yocto-images
          path: /home/seame/PDC/headunit/yocto-build/build/tmp/deploy/images/**/*.wic
          retention-days: 7

      - name: Notify on failure
        if: failure()
        run: |
          echo "Build failed! Check logs above."
